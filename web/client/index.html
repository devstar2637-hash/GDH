<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Rehearsal — 만 개의 가게 · Ten Thousand Stores (500 AI design families x 20 variations)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
:root {
  --bg-page: #ffffff;
  --bg-subtle: #f8fafc;
  --bg-terminal: #181e29;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #64748b;
  --border-light: #e2e8f0;
  --border-mid: #cbd5e1;
  --accent-dark: #181e29;
  --accent-blue: #2563eb;
  --accent-emerald: #059669;
  --accent-red: #dc2626;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background-color: var(--bg-page);
  color: var(--text-primary);
  font-family: "Plus Jakarta Sans", "Noto Sans KR", -apple-system,
    BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 14px;
  line-height: 1.55;
  word-break: keep-all;
  -webkit-font-smoothing: antialiased;
}

button,
input,
select {
  font: inherit;
}

button {
  cursor: pointer;
  transition: all 120ms ease;
}

button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.tabular {
  font-family: "JetBrains Mono", "Noto Sans KR", monospace;
  font-variant-numeric: tabular-nums;
}

.hidden {
  display: none !important;
}

/* 1. Top Header (exact rea.tools header) */
.rea-header {
  position: sticky;
  top: 0;
  z-index: 40;
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border-light);
}

.rea-header-inner {
  max-width: 1440px;
  margin: 0 auto;
  padding: 0 28px;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.rea-brand {
  display: flex;
  align-items: baseline;
  gap: 12px;
}

.rea-logo {
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.04em;
  color: var(--text-primary);
  text-decoration: none;
}

.rea-tagline {
  font-size: 12.5px;
  color: var(--text-muted);
  font-weight: 500;
}

.rea-nav {
  display: flex;
  align-items: center;
  gap: 24px;
}

.rea-nav-link {
  color: var(--text-secondary);
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
}

.rea-nav-link:hover,
.rea-nav-link.active {
  color: var(--text-primary);
}

.rea-header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* rea.tools Button System */
.rea-btn-solid {
  background: var(--accent-dark);
  color: #ffffff;
  border: 1px solid var(--accent-dark);
  border-radius: 7px;
  padding: 7px 14px;
  font-size: 12.5px;
  font-weight: 600;
  white-space: nowrap;
}

.rea-btn-solid:hover:not(:disabled) {
  background: #27303f;
}

.rea-btn-outline {
  background: #ffffff;
  color: var(--text-primary);
  border: 1px solid var(--border-mid);
  border-radius: 7px;
  padding: 7px 13px;
  font-size: 12.5px;
  font-weight: 600;
  white-space: nowrap;
}

.rea-btn-outline:hover:not(:disabled) {
  border-color: var(--text-secondary);
  background: var(--bg-subtle);
}

.rea-btn-outline.active {
  background: #eff6ff;
  border-color: var(--accent-blue);
  color: #1d4ed8;
}

/* 2. Main Layout with Right Sticky TOC Rail (rea.tools layout) */
.rea-layout {
  max-width: 1440px;
  margin: 0 auto;
  padding: 28px 28px 64px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 170px;
  gap: 36px;
  align-items: start;
}

.rea-main-col {
  min-width: 0;
}

.rea-toc {
  position: sticky;
  top: 88px;
  display: flex;
  flex-direction: column;
  border-left: 1px solid var(--border-light);
}

.rea-toc-title {
  font-size: 11.5px;
  font-weight: 700;
  color: var(--text-primary);
  padding: 4px 14px 8px;
}

.rea-toc-link {
  font-size: 12px;
  color: var(--text-muted);
  text-decoration: none;
  padding: 7px 14px;
  border-left: 2px solid transparent;
  margin-left: -1px;
}

.rea-toc-link.active,
.rea-toc-link:hover {
  color: var(--text-primary);
  font-weight: 700;
  border-left-color: var(--accent-blue);
  background: #f1f5f9;
}

/* 3. Sections & 2-Column Editorial Setup */
.rea-section {
  padding: 8px 0;
  scroll-margin-top: 76px;
}

.rea-divider {
  border: 0;
  border-top: 1px solid var(--border-light);
  margin: 28px 0;
}

.rea-two-col {
  display: grid;
  grid-template-columns: 1.05fr 1fr;
  gap: 32px;
  align-items: start;
}

.rea-kicker {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  margin-bottom: 6px;
}

.rea-h1 {
  font-size: clamp(28px, 3.2vw, 42px);
  font-weight: 800;
  letter-spacing: -0.035em;
  line-height: 1.15;
  margin: 0 0 12px;
  color: var(--text-primary);
}

.rea-h2 {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.03em;
  margin: 0;
  color: var(--text-primary);
}

.rea-lead {
  font-size: 14.5px;
  color: var(--text-secondary);
  margin: 0 0 16px;
  line-height: 1.6;
}

.rea-step-title {
  font-size: 13.5px;
  font-weight: 800;
  color: var(--text-primary);
  margin-bottom: 8px;
}

/* Commercial District Evidence Card */
.rea-evidence-box {
  background: var(--bg-subtle);
  border: 1px solid var(--border-light);
  border-radius: 10px;
  padding: 16px;
}

.rea-evidence-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}

.rea-badge-dark {
  background: var(--accent-dark);
  color: #ffffff;
  font-size: 12px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 6px;
}

.rea-survival-pill {
  background: #ecfdf5;
  border: 1px solid #a7f3d0;
  color: #065f46;
  font-size: 12px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 6px;
}

.rea-evidence-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.rea-ev-item {
  background: #ffffff;
  border: 1px solid var(--border-light);
  border-radius: 8px;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.ev-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
}

.ev-val {
  font-size: 16px;
  font-weight: 800;
  color: var(--text-primary);
}

.ev-val.ev-profit {
  color: var(--accent-emerald);
}

.ev-sub {
  font-size: 11px;
  color: var(--text-muted);
}

/* Signature Dark Terminal Card (exact rea.tools terminal card) */
.rea-terminal-card {
  background: var(--bg-terminal);
  color: #f8fafc;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 10px 26px rgba(15, 23, 42, 0.12);
}

.rea-terminal-bar {
  padding: 10px 16px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: #94a3b8;
}

.rea-dots {
  display: flex;
  gap: 6px;
}

.rea-dots i {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #475569;
  display: inline-block;
}

.rea-terminal-body {
  padding: 16px;
}

.rea-term-label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: "JetBrains Mono", "Noto Sans KR", monospace;
  font-size: 12px;
  color: #cbd5e1;
  margin-bottom: 8px;
}

.rea-district-chips {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 6px;
  margin-bottom: 8px;
}

.rea-term-chip {
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.12);
  color: #cbd5e1;
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 12px;
  font-weight: 600;
  text-align: left;
}

.rea-term-chip.active {
  background: #ffffff;
  color: #0f172a;
  border-color: #ffffff;
  font-weight: 700;
}

.rea-term-input {
  flex: 1;
  width: 100%;
  background: rgba(15, 23, 42, 0.65);
  border: 1px solid rgba(255, 255, 255, 0.16);
  color: #f8fafc;
  border-radius: 6px;
  padding: 7px 10px;
  font-size: 12px;
  font-family: "JetBrains Mono", "Noto Sans KR", monospace;
}

.rea-link-input-row {
  display: flex;
  gap: 6px;
  align-items: center;
}

.rea-link-parse-btn {
  background: #10b981;
  color: #ffffff;
  border: none;
  border-radius: 6px;
  padding: 7px 12px;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
}

.rea-link-parse-btn:hover {
  background: #059669;
}

.rea-parsed-box {
  margin-top: 8px;
  background: rgba(15, 23, 42, 0.55);
  border: 1px solid rgba(52, 211, 153, 0.28);
  border-radius: 7px;
  padding: 8px 10px;
}

.rea-parsed-status {
  font-size: 11px;
  color: #6ee7b7;
  font-weight: 600;
  margin-bottom: 6px;
}

.rea-unit-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.rea-unit-chip {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.16);
  color: #e2e8f0;
  border-radius: 5px;
  padding: 4px 8px;
  font-size: 11px;
  font-weight: 600;
}

.rea-unit-chip.active {
  background: #10b981;
  border-color: #10b981;
  color: #ffffff;
  font-weight: 700;
}

.d3-tenk-box {
  margin-top: 12px;
  background: #ffffff;
  border: 1px solid var(--border-light);
  border-radius: 8px;
  padding: 10px 12px 6px;
}

.d3-tenk-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 4px;
}

.d3-tenk-head strong {
  font-size: 11.5px;
  color: var(--text-primary);
}

.d3-tenk-legend {
  display: flex;
  gap: 8px;
  font-size: 10.5px;
  color: var(--text-muted);
}

.d3-tenk-legend span {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.d3-tenk-legend i {
  width: 8px;
  height: 8px;
  border-radius: 2px;
  display: inline-block;
}

.d3-tenk-svg {
  width: 100%;
  height: 86px;
  display: block;
}

.rea-term-slider {
  width: 100%;
  accent-color: #34d399;
}

.rea-cat-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 6px;
}

.rea-cat-btn {
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.14);
  color: #f8fafc;
  border-radius: 7px;
  padding: 8px 10px;
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.rea-cat-btn.active {
  background: #ecfdf5;
  border-color: #10b981;
  color: #064e3b;
}

.rea-cat-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12.5px;
}

.rea-best-tag {
  background: #10b981;
  color: #ffffff;
  font-size: 10px;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 4px;
}

.rea-cat-meta {
  font-size: 11px;
  opacity: 0.8;
}

/* Section 2: Interactive Floorplan Stage */
.rea-sec-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 16px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}

.rea-env-controls {
  display: flex;
  gap: 8px;
}

.rea-rule-strip {
  display: grid;
  grid-template-columns: 1fr 1.2fr;
  gap: 16px;
  margin-bottom: 14px;
  background: var(--bg-subtle);
  border: 1px solid var(--border-light);
  border-radius: 10px;
  padding: 14px 16px;
}

.rea-design-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}

.rea-choice-btn {
  background: #ffffff;
  border: 1px solid var(--border-mid);
  border-radius: 7px;
  padding: 8px 10px;
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.rea-choice-btn strong {
  font-size: 12px;
  color: var(--text-primary);
}

.rea-choice-btn span {
  font-size: 10.5px;
  color: var(--text-muted);
}

.rea-choice-btn.active {
  border: 1.5px solid var(--accent-blue);
  background: #eff6ff;
}

.rea-scn-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}

.rea-scn-btn {
  background: #ffffff;
  border: 1px solid var(--border-mid);
  border-radius: 7px;
  padding: 7px 9px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text-primary);
}

.rea-scn-btn small {
  color: var(--accent-blue);
  font-weight: 700;
}

.rea-scn-btn.active {
  background: var(--accent-dark);
  border-color: var(--accent-dark);
  color: #ffffff;
}

.rea-scn-btn.active small {
  color: #93c5fd;
}

.rea-rule-note {
  margin: 8px 0 0;
  font-size: 12px;
  color: var(--text-secondary);
}

/* Main Stage Card */
.rea-stage-card {
  background: #ffffff;
  border: 1px solid var(--border-light);
  border-radius: 12px;
  padding: 16px;
}

.compare {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.world {
  border: 1px solid var(--border-light);
  border-radius: 10px;
  overflow: hidden;
  background: #ffffff;
  display: flex;
  flex-direction: column;
}

.world.proposed {
  border: 1.5px solid var(--accent-emerald);
}

.world-top {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border-light);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.world-tag {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  display: block;
}

.world-tag.emerald {
  color: var(--accent-emerald);
}

.world-top h3 {
  margin: 1px 0 0;
  font-size: 15px;
  font-weight: 800;
}

.route-status {
  font-size: 11.5px;
  font-weight: 700;
  color: var(--accent-emerald);
  background: #ecfdf5;
  padding: 3px 8px;
  border-radius: 6px;
}

.route-status.bad {
  color: var(--accent-red);
  background: #fef2f2;
}

.canvasbox {
  height: 360px;
  position: relative;
}

.canvasbox canvas {
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

.canvas-floating-tools {
  position: absolute;
  top: 8px;
  left: 10px;
  right: 10px;
  display: flex;
  justify-content: space-between;
  gap: 6px;
  pointer-events: none;
  flex-wrap: wrap;
}

.object-chips,
.canvas-tool-btns {
  display: flex;
  gap: 4px;
  pointer-events: auto;
  background: rgba(255, 255, 255, 0.92);
  border: 1px solid var(--border-mid);
  padding: 3px;
  border-radius: 7px;
}

.obj-chip,
.rea-mini-btn {
  background: transparent;
  border: none;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-secondary);
  padding: 3px 8px;
  border-radius: 5px;
}

.obj-chip.active {
  background: var(--accent-dark);
  color: #ffffff;
}

.rea-mini-btn:hover {
  background: var(--bg-subtle);
  color: var(--text-primary);
}

.world-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border-top: 1px solid var(--border-light);
  background: var(--bg-subtle);
}

.w-stat {
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 4px;
}

.w-stat + .w-stat {
  border-left: 1px solid var(--border-light);
}

.w-stat-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 6px;
  flex-wrap: wrap;
}

.w-label {
  display: block;
  font-size: 10.5px;
  font-weight: 700;
  color: var(--text-muted);
}

.w-num {
  font-size: 20px;
  font-weight: 800;
  color: var(--text-primary);
}

.w-unit {
  font-size: 11px;
  color: var(--text-muted);
  margin-left: 2px;
}

.w-sub {
  display: block;
  font-size: 10.5px;
  color: var(--text-muted);
}

.d3-chart-slot {
  width: 100%;
  height: 54px;
}

.d3-stat-svg {
  width: 100%;
  height: 54px;
  display: block;
}

.delta-tag {
  font-size: 11.5px;
  font-weight: 700;
  margin-left: 4px;
}

.delta-tag.good {
  color: var(--accent-emerald);
}

.delta-tag.bad {
  color: var(--accent-red);
}

/* Playback & Fine Controls */
.rea-play-controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border-light);
  flex-wrap: wrap;
}

.rea-play-left,
.rea-walk-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.rea-play-left {
  flex: 1;
}

.rea-play-left input[type="range"] {
  flex: 1;
  min-width: 120px;
  accent-color: var(--accent-dark);
}

.speed {
  border: 1px solid var(--border-mid);
  border-radius: 6px;
  padding: 5px 8px;
  font-size: 12px;
  font-weight: 600;
}

.dpad {
  display: inline-flex;
  gap: 3px;
}

.dpad-btn {
  width: 28px;
  height: 28px;
  border: 1px solid var(--border-mid);
  background: #ffffff;
  border-radius: 6px;
  font-size: 10px;
}

.rea-walk-hint {
  font-size: 11.5px;
  color: var(--text-muted);
}

.rea-fine-bar {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
  margin-top: 12px;
  padding: 12px;
  background: var(--bg-subtle);
  border: 1px solid var(--border-light);
  border-radius: 8px;
}

.fine-item label {
  display: flex;
  justify-content: space-between;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 4px;
}

.fine-item input[type="range"],
.fine-item select,
.fine-item input[type="number"] {
  width: 100%;
  accent-color: var(--accent-dark);
}

.fine-item select,
.fine-item input[type="number"] {
  border: 1px solid var(--border-mid);
  border-radius: 6px;
  padding: 4px 6px;
  background: #ffffff;
  font-size: 12px;
}

.rea-insight-bar {
  margin-top: 12px;
  background: #ecfdf5;
  border: 1px solid #a7f3d0;
  border-radius: 8px;
  padding: 12px 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.rea-insight-bar strong {
  color: #064e3b;
  font-size: 13.5px;
}

.rea-insight-bar .muted {
  color: #065f46;
  font-size: 12px;
}

/* Blueprint upload & calibration */
.calibration-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.calibration-grid label {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text-secondary);
}

.calibration-grid input {
  width: 100%;
  margin-top: 4px;
  padding: 6px 8px;
  border: 1px solid var(--border-mid);
  border-radius: 6px;
  background: #ffffff;
}

#imageCanvas {
  width: 100%;
  height: 190px;
  border: 1px solid var(--border-light);
  border-radius: 8px;
  display: block;
  margin-bottom: 8px;
  cursor: crosshair;
}

.checkrow {
  display: flex;
  gap: 6px;
  font-size: 12px;
  color: var(--text-secondary);
}

.status {
  font-size: 12px;
  color: var(--accent-emerald);
  font-weight: 600;
}

.plan-preview pre {
  background: #ffffff;
  border: 1px solid var(--border-light);
  padding: 10px;
  border-radius: 6px;
  font-size: 11.5px;
  white-space: pre-wrap;
}

@media (max-width: 1100px) {
  .rea-layout {
    grid-template-columns: 1fr;
    padding: 20px 16px 48px;
  }
  .rea-toc {
    display: none;
  }
  .rea-two-col,
  .rea-rule-strip,
  .compare {
    grid-template-columns: 1fr;
  }
  .rea-fine-bar {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 768px) {
  .rea-header-inner {
    height: auto;
    padding: 10px 16px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .rea-tagline,
  .rea-nav {
    display: none;
  }
  .rea-design-row,
  .rea-scn-row {
    grid-template-columns: repeat(2, 1fr);
  }
}
